services:
  postgres:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2}
    user: ${POSTGRES_UID:-70}:${POSTGRES_GID:-70}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
      PGDATA: /var/lib/postgresql/18/data
    volumes:
    - ./postgres:/var/lib/postgresql
    networks:
    - database
    tmpfs:
    - /tmp:size=64M,mode=1777
    - /run/postgresql:size=32M,uid=${POSTGRES_UID:-70},gid=${POSTGRES_GID:-70},mode=0755
    stop_grace_period: 30s
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -h
      - 127.0.0.1
      - -U
      - postgres
      - -d
      - postgres
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
  database-init:
    restart: 'no'
    tmpfs:
    - /var/lib/postgresql:size=16M,uid=${POSTGRES_UID:-70},gid=${POSTGRES_GID:-70},mode=0700
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2}
    user: ${POSTGRES_UID:-70}:${POSTGRES_GID:-70}
    read_only: true
    entrypoint:
    - psql
    command:
    - -h
    - postgres
    - -U
    - postgres
    - -d
    - postgres
    - -v
    - ON_ERROR_STOP=1
    - -f
    - /init.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: '10'
      PGOPTIONS: -c statement_timeout=30000
      PGDATA: /var/lib/postgresql/18/data
      TZ: ${TZ:-UTC}
    networks:
    - database
    mem_limit: 64m
    pids_limit: 32
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
    - type: bind
      source: ./runtime-config/database-init/config_init_sql
      target: /init.sql
      read_only: true
      bind:
        create_host_path: false
  server:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${SERVER_IMAGE:-ghcr.io/goauthentik/server:2026.8.1@sha256:9d605ed569ff9f39146be39da93714b2acf19072acc4ab0f0e2f2d81be88cdce}
    user: 1000:1000
    read_only: true
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_WEB__BASE_URL: ${SITE_URL}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: 'true'
      TZ: ${TZ:-UTC}
    networks:
    - frontend
    - database
    shm_size: 512m
    tmpfs:
    - /tmp:size=128M,mode=1777
    mem_limit: 1g
    pids_limit: 256
    volumes:
    - ./data:/data
    - ./templates:/templates
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/-/health/ready/', timeout=5).close()
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    command: server
    ports:
    - 127.0.0.1:${PORT}:9000
    depends_on:
      database-init:
        condition: service_completed_successfully
  worker:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${SERVER_IMAGE:-ghcr.io/goauthentik/server:2026.8.1@sha256:9d605ed569ff9f39146be39da93714b2acf19072acc4ab0f0e2f2d81be88cdce}
    user: 1000:1000
    read_only: true
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_WEB__BASE_URL: ${SITE_URL}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: 'true'
      AUTHENTIK_BOOTSTRAP_EMAIL: ${ADMIN_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD_HASH: ${AUTHENTIK_BOOTSTRAP_PASSWORD_HASH}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      TZ: ${TZ:-UTC}
    networks:
    - frontend
    - database
    shm_size: 512m
    tmpfs:
    - /tmp:size=128M,mode=1777
    mem_limit: 768m
    pids_limit: 256
    volumes:
    - ./data:/data
    - ./templates:/templates
    - ./certs:/certs
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/-/health/ready/', timeout=5).close()
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    command: worker
    depends_on:
      server:
        condition: service_healthy
  prepare:
    image: ${PREPARE_IMAGE:-busybox:1.37.0-musl@sha256:fc6dddc4c44b1bfe37f41cae8e67d1693828e8f42a91862816d7953e2c9d3f23}
    profiles: [init]
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    pids_limit: 32
    volumes: [.:/project]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        cd /project
        mkdir -p postgres data templates certs
        chown -R ${POSTGRES_UID:-70}:${POSTGRES_GID:-70} postgres
        chmod 0700 postgres
        chown -R 1000:1000 data templates certs
        chmod 0750 data templates certs
        umask 077
        mkdir -p runtime-config/database-init
        chmod 0711 runtime-config runtime-config/database-init
        cat >runtime-config/database-init/config_init_sql.next <<'SQL'
        SELECT 'CREATE ROLE authentik LOGIN PASSWORD ''${AUTHENTIK_DB_PASSWORD}'''
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authentik') \gexec
        SELECT 'CREATE DATABASE authentik OWNER authentik'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'authentik') \gexec
        SQL
        chown ${POSTGRES_UID:-70}:${POSTGRES_GID:-70} runtime-config/database-init/config_init_sql.next
        chmod 0400 runtime-config/database-init/config_init_sql.next
        mv runtime-config/database-init/config_init_sql.next runtime-config/database-init/config_init_sql
        echo "Data directories and configuration files are ready."
networks:
  frontend: {}
  database:
    internal: true
