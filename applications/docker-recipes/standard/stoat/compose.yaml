services:
  database:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    ipc: private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pids_limit: 128
    mem_limit: 640m
    tmpfs:
    - /tmp:size=64m
    image: ${MONGO_IMAGE:-mongo:8.3.8@sha256:5211c51171f57ae60842b11664bb244628971b3d35325762a97888337b9bb0db}
    networks:
    - data
    command:
    - --bind_ip_all
    - --replSet
    - rs0
    - --keyFile
    - /etc/mongo-key
    - --wiredTigerCacheSizeGB
    - '0.25'
    volumes:
    - ./mongo:/data/db
    - ./mongo-config:/data/configdb
    - ./runtime-checks:/checks:ro
    environment:
      TZ: ${TZ:-UTC}
    user: 999:999
    configs:
    - source: mongo-key
      target: /etc/mongo-key
      uid: '999'
      gid: '999'
      mode: 256
    healthcheck:
      test: ["CMD", "/checks/busybox", "nc", "-z", "-w", "3", "127.0.0.1", "27017"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
  redis:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    ipc: private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pids_limit: 128
    mem_limit: 128m
    tmpfs:
    - /tmp:size=64m
    image: ${REDIS_IMAGE:-redis:8.6.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36}
    networks:
    - data
    - voice
    command:
    - redis-server
    - /etc/redis.conf
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
    - ./redis:/data
    - type: bind
      source: ./runtime-config/redis/redis-conf
      target: /etc/redis.conf
      read_only: true
      bind:
        create_host_path: false
    read_only: true
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -e
      - ping
      interval: 10s
      timeout: 5s
      retries: 12
    user: ${REDIS_UID:-999}:${REDIS_GID:-1000}
  rabbit:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    ipc: private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pids_limit: 128
    mem_limit: 512m
    tmpfs:
    - /tmp:size=64m
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.2.6-alpine@sha256:eb0bf75f2749de101492a7d3b031095e903fbb02aca3baa34dbaa27589c22efb}
    networks:
    - rabbit
    user: ${RABBITMQ_UID:-100}:${RABBITMQ_GID:-101}
    hostname: rabbit
    environment:
      RABBITMQ_DEFAULT_USER: stoat
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +S 2:2 -rabbit vm_memory_high_watermark {absolute,"256MiB"}
      TZ: ${TZ:-UTC}
      HOME: /var/lib/rabbitmq
    volumes:
    - ./rabbit:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_port_connectivity
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 60s
  garage:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    ipc: private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pids_limit: 128
    mem_limit: 256m
    tmpfs:
    - /tmp:size=64m
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690}
    networks:
    - data
    volumes:
    - ./garage/meta:/var/lib/garage/meta
    - ./garage/data:/var/lib/garage/data
    - type: bind
      source: ./runtime-config/garage/garage-toml
      target: /etc/garage.toml
      read_only: true
      bind:
        create_host_path: false
    read_only: true
    healthcheck:
      test:
      - CMD
      - /garage
      - status
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      TZ: ${TZ:-UTC}
  api:
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    ipc: private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pids_limit: 128
    mem_limit: 128m
    tmpfs:
    - /tmp:size=64m
    read_only: true
    image: ${API_IMAGE:-ghcr.io/stoatchat/api:v0.12.1@sha256:933ecc39f8e7db20289044ce9ab966738733eec90a992149f2212f3470847af0}
    depends_on:
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
    - app
    - data
    - rabbit
    - frontend
    environment:
      TZ: ${TZ:-UTC}
      REVOLT__DATABASE__MONGODB: mongodb://stoat:${MONGO_PASSWORD}@database:27017/revolt?authSource=revolt&replicaSet=rs0
      REVOLT__DATABASE__REDIS: redis://:${REDIS_PASSWORD}@redis:6379/
      REVOLT__RABBIT__HOST: rabbit
      REVOLT__RABBIT__PORT: '5672'
      REVOLT__RABBIT__USERNAME: stoat
      REVOLT__RABBIT__PASSWORD: ${RABBIT_PASSWORD}
      REVOLT__FILES__S3__ENDPOINT: http://garage:3900
      REVOLT__FILES__S3__ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      REVOLT__FILES__S3__SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      REVOLT__FILES__S3__DEFAULT_BUCKET: revolt-uploads
      REVOLT__FILES__S3__REGION: garage
      REVOLT__FILES__S3__PATH_STYLE_BUCKETS: 'true'
      REVOLT__FILES__ENCRYPTION_KEY: ${FILES_ENCRYPTION_KEY}
      REVOLT__PUSHD__VAPID__PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      REVOLT__PUSHD__VAPID__PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      REVOLT__API__LIVEKIT__NODES__WORLDWIDE__KEY: ${LIVEKIT_KEY}
      REVOLT__API__LIVEKIT__NODES__WORLDWIDE__SECRET: ${LIVEKIT_SECRET}
    volumes:
    - ./runtime-checks:/checks:ro
    - type: bind
      source: ./runtime-config/api/revolt
      target: /Revolt.toml
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test: ["CMD", "/checks/busybox", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:14702/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
