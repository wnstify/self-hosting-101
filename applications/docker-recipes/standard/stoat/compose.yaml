            }
            handle /stoat.json {
                root * /srv
                file_server
            }
            handle {
                reverse_proxy web:5000
            }
        }
        RECIPEFILE
        chown ${CADDY_UID:-0}:${CADDY_GID:-0} runtime-config/caddy/Caddyfile.next
        chmod 0444 runtime-config/caddy/Caddyfile.next
        mv runtime-config/caddy/Caddyfile.next runtime-config/caddy/Caddyfile
        mkdir -p runtime-config/caddy
        chmod 0711 runtime-config/caddy
        cat > runtime-config/caddy/stoat-json.next <<'RECIPEFILE'
        {"api":"${BASE_URL}/api"}
        RECIPEFILE
        chown ${CADDY_UID:-0}:${CADDY_GID:-0} runtime-config/caddy/stoat-json.next
        chmod 0444 runtime-config/caddy/stoat-json.next
        mv runtime-config/caddy/stoat-json.next runtime-config/caddy/stoat-json
        mkdir -p runtime-config/mongo-init
        chmod 0711 runtime-config/mongo-init
        cat > runtime-config/mongo-init/init-scripts-init-mongo-js.next <<'RECIPEFILE'
        const deadline = Date.now() + 120000;
        let connection;
        while (Date.now() < deadline) {
            try {
                connection = new Mongo('mongodb://127.0.0.1:27017/?directConnection=true&serverSelectionTimeoutMS=2000');
                if (connection.getDB('admin').runCommand({ping: 1}).ok) break;
            } catch (e) {
                if (Date.now() + 1000 >= deadline) throw e;
            }
            sleep(1000);
        }
        if (!connection) throw new Error('MongoDB startup timed out.');
        const admin = connection.getDB('admin');
        function waitForPrimary() {
            while (!admin.runCommand({hello: 1}).isWritablePrimary) {
                if (Date.now() >= deadline) throw new Error('MongoDB primary election timed out.');
                sleep(500);
            }
        }
        let authenticated = false;
        try {
            authenticated = !!admin.auth('admin', process.env.MONGO_ROOT_PASSWORD);
        } catch (e) {
            if (e.code !== 18) throw e;
        }
        if (!authenticated) {
            try {
                admin.runCommand({replSetGetStatus: 1});
            } catch (e) {
                if (e.code !== 94) throw e;
                const result = admin.runCommand({replSetInitiate: {_id: 'rs0', members: [{_id: 0, host: 'database:27017'}]}});
                if (!result.ok) throw new Error('Replica set initialization failed.');
            }
            waitForPrimary();
            admin.createUser({user: 'admin', pwd: process.env.MONGO_ROOT_PASSWORD, roles: ['root']});
            if (!admin.auth('admin', process.env.MONGO_ROOT_PASSWORD)) throw new Error('MongoDB authentication failed.');
        }
        waitForPrimary();
        const app = connection.getDB('revolt');
        if (!app.getUser('stoat')) {
            app.createUser({user: 'stoat', pwd: process.env.MONGO_PASSWORD, roles: ['readWrite', 'dbAdmin']});
        }
        if (!admin.runCommand({hello: 1}).isWritablePrimary) throw new Error('MongoDB has no writable primary.');
        print('MongoDB replica set and application user are ready.');
        RECIPEFILE
        chown 1000:1000 runtime-config/mongo-init/init-scripts-init-mongo-js.next
        chmod 0444 runtime-config/mongo-init/init-scripts-init-mongo-js.next
        mv runtime-config/mongo-init/init-scripts-init-mongo-js.next runtime-config/mongo-init/init-scripts-init-mongo-js
        mkdir -p runtime-config/garage-init
        chmod 0711 runtime-config/garage-init
        cat > runtime-config/garage-init/init-scripts-init-garage-py.next <<'RECIPEFILE'
        import json
        import os
        import time
        import urllib.error
        import urllib.request

        base = 'http://garage:3903/v2/'
        headers = {'Authorization': 'Bearer ' + os.environ['GARAGE_ADMIN_TOKEN'], 'Content-Type': 'application/json'}

        def request(operation, data=None):
            body = None if data is None else json.dumps(data).encode()
            with urllib.request.urlopen(urllib.request.Request(base + operation, data=body, headers=headers), timeout=10) as response:
                return json.load(response)

        layout = request('GetClusterLayout')
        if layout['version'] == 0:
            nodes = [node['id'] for node in request('GetClusterStatus')['nodes'] if node['isUp']]
            if len(nodes) != 1:
                raise RuntimeError('Expected one active Garage node.')
            request('UpdateClusterLayout', {'roles': [{'id': nodes[0], 'zone': 'local', 'capacity': 10737418240, 'tags': []}]})
            request('ApplyClusterLayout', {'version': 1})
            if request('GetClusterLayout')['version'] != 1:
                raise RuntimeError('Garage layout was not applied.')

        key = os.environ['S3_ACCESS_KEY']
        if not any(item['id'] == key for item in request('ListKeys')):
            request('ImportKey', {'accessKeyId': key, 'secretAccessKey': os.environ['S3_SECRET_KEY'], 'name': 'stoat'})
        buckets = [item for item in request('ListBuckets') if 'revolt-uploads' in item.get('globalAliases', [])]
        bucket = buckets[0] if buckets else request('CreateBucket', {'globalAlias': 'revolt-uploads'})
        request('AllowBucketKey', {'bucketId': bucket['id'], 'accessKeyId': key, 'permissions': {'read': True, 'write': True, 'owner': True}})
        for attempt in range(30):
            try:
                with urllib.request.urlopen('http://garage:3903/health', timeout=5) as response:
                    if response.status == 200:
                        break
            except urllib.error.URLError:
                pass
            time.sleep(1)
        else:
            raise RuntimeError('Garage health check timed out.')
        for attempt in range(120):
            try:
                with urllib.request.urlopen('http://api:14702/', timeout=5) as response:
                    if response.status == 200:
                        break
            except urllib.error.URLError:
                pass
            time.sleep(1)
        else:
            raise RuntimeError('Stoat API migrations timed out.')
        print('Garage storage and Stoat API migrations are ready.')
        RECIPEFILE
        chown 65532:65532 runtime-config/garage-init/init-scripts-init-garage-py.next
        chmod 0444 runtime-config/garage-init/init-scripts-init-garage-py.next
        mv runtime-config/garage-init/init-scripts-init-garage-py.next runtime-config/garage-init/init-scripts-init-garage-py
        cat > runtime-config/revolt.tmp <<'RECIPEFILE'
        [hosts]
        app = "${BASE_URL}"
        api = "${BASE_URL}/api"
        events = "${WS_URL}/ws"
        autumn = "${BASE_URL}/autumn"
        january = "${BASE_URL}/january"
        gifbox = "${BASE_URL}/gifbox"

        [hosts.livekit]
        worldwide = "${WS_URL}/livekit"

        [api.livekit.nodes.worldwide]
        url = "http://livekit:7880"
        lat = 0.0
        lon = 0.0

        [api.registration]
        invite_only = false

        [features]
        webhooks_enabled = false

        [features.limits.new_user]
        video_resolution = [1920, 1080]
        video_aspect_ratio = [0.3, 10]

        [features.limits.default]
        video_resolution = [1920, 1080]
        video_aspect_ratio = [0.3, 10]
        RECIPEFILE
        for service in api events autumn january gifbox crond pushd voice-ingress; do
          mkdir -p "runtime-config/$$service"
          chmod 0711 "runtime-config/$$service"
          cp runtime-config/revolt.tmp "runtime-config/$$service/revolt.next"
          chown 65532:65532 "runtime-config/$$service/revolt.next"
          chmod 0444 "runtime-config/$$service/revolt.next"
          mv "runtime-config/$$service/revolt.next" "runtime-config/$$service/revolt"
        done
        rm -f runtime-config/revolt.tmp
        echo "Data directories and runtime configuration are ready."
networks:
  frontend: {}
  app:
    internal: true
  data:
    internal: true
  rabbit:
    internal: true
  voice:
    internal: true
configs:
  mongo-key:
    content: |
      ${MONGO_KEY}
