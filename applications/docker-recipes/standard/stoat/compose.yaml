        RECIPEFILE
        chown 0:0 runtime-config/garage/garage-toml.next
        chmod 0400 runtime-config/garage/garage-toml.next
        mv runtime-config/garage/garage-toml.next runtime-config/garage/garage-toml
        mkdir -p runtime-config/livekit
