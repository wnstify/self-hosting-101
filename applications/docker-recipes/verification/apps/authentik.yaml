probe:
  path: /-/health/ready/
  status: [200]
timeout: 600
derive:
  - "printf \"AUTHENTIK_BOOTSTRAP_PASSWORD_HASH='%s'\\n\" \"$(printf '%s' \"$AUTHENTIK_ADMIN_PASSWORD\" | python3 -c 'import base64,hashlib,secrets,sys; s=secrets.token_hex(16); d=hashlib.pbkdf2_hmac(\"sha256\",sys.stdin.buffer.read(),s.encode(),1000000); print(\"$\".join([\"pbkdf2_sha256\",\"1000000\",s,base64.b64encode(d).decode()]))')\""
allow:
  - text: duplicate key value violates unique constraint "authentik_events_notificationtransport_name_key"
    why: First boot sometimes applies the default transport blueprint twice; authentik handles the IntegrityError and logs nothing. Seen in the standard flavor on 2026-09-09.
  - text: current transaction is aborted, commands ignored until end of transaction block
    why: PostgreSQL's follow-up line for the rejected insert above.
