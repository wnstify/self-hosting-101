services:
  openwebui:
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.3-slim@sha256:bb3633af77b35d97783affc9cd8097d8a6dc89fedd5a410ce9a50d85556a870c}
    user: 0:0
    restart: unless-stopped
    environment:
      WEBUI_URL: ${SITE_URL}
      CORS_ALLOW_ORIGIN: ${SITE_URL};http://localhost:${PORT};http://127.0.0.1:${PORT}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: 'true'
      WEBUI_ADMIN_EMAIL: ${ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ENABLE_SIGNUP: 'false'
      DEFAULT_USER_ROLE: pending
      ENABLE_OLLAMA_API: 'false'
      ENABLE_OPENAI_API: 'false'
      TZ: ${TZ}
    volumes:
    - ./data:/app/backend/data
    - ./home:/root
    - ./tmp:/tmp
    ports:
    - 127.0.0.1:${PORT}:8080
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    ipc: private
    mem_limit: 2g
    pids_limit: 300
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --show-error
      - --max-time
      - '5'
      - http://127.0.0.1:8080/health/db
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  prepare:
    image: ${PREPARE_IMAGE:-busybox:1.37.0-musl@sha256:fc6dddc4c44b1bfe37f41cae8e67d1693828e8f42a91862816d7953e2c9d3f23}
    profiles: [init]
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    pids_limit: 32
    volumes: [.:/project]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        cd /project
        mkdir -p data home tmp
        chown -R 0:0 data home tmp
        chmod 0700 data home tmp
        echo "Data directories are ready."
networks:
  default: {}
